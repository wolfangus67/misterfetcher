[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
markers =
    unit: Unit tests that don't require external dependencies
    integration: Integration tests that require the running container
    api: API endpoint tests
    ui: UI-related functionality tests
    slow: Tests that take a long time to run
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning