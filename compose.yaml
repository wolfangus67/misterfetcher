services:
  misterfetcher:
    build:
      context: https://github.com/wolfangus67/misterfetcher.git#main
      dockerfile: Dockerfile
    container_name: misterfetcher
    platform: linux/arm64
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      TZ: Europe/Paris
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      DOCKER_DATA_DIR: /app/data

    volumes:
      - misterfetcher-data:/app/data

    networks:
      - webnet

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:5000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  webnet:
    external: true

volumes:
  misterfetcher-data:
