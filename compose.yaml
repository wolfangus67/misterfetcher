services:
  misterfetcher:
    build:
      context: .  # <-- On utilise le dossier local actuel au lieu de retélécharger depuis GitHub
      dockerfile: Dockerfile
    container_name: misterfetcher
    # platform: linux/arm64 # <-- Commenté pour tourner sur ton PC Windows local
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      TZ: Europe/Paris
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      DOCKER_DATA_DIR: /app/data

    volumes:
      - misterfetcher-data:/app/data

    networks:
      - webnet

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:5000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  webnet:
    # external: true # <-- Commenté pour que Docker crée le réseau localement s'il n'existe pas

volumes:
  misterfetcher-data: